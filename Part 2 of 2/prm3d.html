<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Probabilistic Roadmap Method (PRM) in 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e24;
      color: #e0e0e6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 380px;
      background: #25252d;
      border-right: 1px solid #33333f;
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 14px;
      overflow-y: auto;
      z-index: 10;
    }
    h1 { font-size: 1.2rem; color: #ffffff; }
    p.desc { font-size: 0.8rem; color: #a0a0b0; line-height: 1.35; }
    .control-group {
      background: #1a1a20;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #2e2e38;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8a8a9a;
      display: flex;
      justify-content: space-between;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }
    .slider-row label { width: 50px; font-weight: normal; text-transform: none; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    button.secondary { background: #374151; }
    button.secondary:hover { background: #4b5563; }
    button.active { background: #10b981; }
    input[type="range"] {
      flex: 1;
      accent-color: #3b82f6;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #d1d5db;
      cursor: pointer;
    }
    #status {
      font-size: 0.8rem;
      padding: 8px;
      border-radius: 4px;
      background: #111827;
      border: 1px solid #1f2937;
    }
    #status.success { border-color: #10b981; color: #34d399; }
    #status.fail { border-color: #ef4444; color: #f87171; }
    #viewport { flex: 1; position: relative; }
  </style>
  <!-- Three.js, OrbitControls, and TransformControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

  <div id="sidebar">
    <h1>3D PRM Motion Planning</h1>
    <p class="desc">3-link robot arm navigating around sphere obstacles. Nodes are randomly distributed inside a 3D bounding box configuration space. Use the on-screen gizmos or sliders to shift obstacles.</p>

    <div class="control-group">
      <label>Gizmo Selection</label>
      <div class="btn-grid">
        <button id="btnGizmoBlue" class="active">Gizmo: Blue Sphere</button>
        <button id="btnGizmoYellow" class="secondary">Gizmo: Yellow Sphere</button>
      </div>
    </div>

    <div class="control-group">
      <label>Roadmap Sampling</label>
      <div class="btn-grid">
        <button id="btnAdd">Add 100 Vertices</button>
        <button id="btnRestart" class="secondary">Restart Roadmap</button>
      </div>
      <button id="btnGoal" class="secondary">New Random Goal (Keep Nodes)</button>
    </div>

    <!-- Blue Sphere Position Controls -->
    <div class="control-group">
      <label style="color: #60a5fa;">Blue Sphere Position</label>
      <div class="slider-row">
        <label>X: <span id="bXVal">0.6</span></label>
        <input type="range" id="bXSlider" min="-2.0" max="2.0" step="0.05" value="0.6">
      </div>
      <div class="slider-row">
        <label>Y: <span id="bYVal">1.4</span></label>
        <input type="range" id="bYSlider" min="0.2" max="3.0" step="0.05" value="1.4">
      </div>
      <div class="slider-row">
        <label>Z: <span id="bZVal">0.5</span></label>
        <input type="range" id="bZSlider" min="-2.0" max="2.0" step="0.05" value="0.5">
      </div>
    </div>

    <!-- Yellow Sphere Position Controls -->
    <div class="control-group">
      <label style="color: #facc15;">Yellow Sphere Position</label>
      <div class="slider-row">
        <label>X: <span id="yXVal">-0.5</span></label>
        <input type="range" id="yXSlider" min="-2.0" max="2.0" step="0.05" value="-0.5">
      </div>
      <div class="slider-row">
        <label>Y: <span id="yYVal">1.8</span></label>
        <input type="range" id="yYSlider" min="0.2" max="3.0" step="0.05" value="1.8">
      </div>
      <div class="slider-row">
        <label>Z: <span id="yZVal">-0.4</span></label>
        <input type="range" id="yZSlider" min="-2.0" max="2.0" step="0.05" value="-0.4">
      </div>
    </div>

    <div class="control-group">
      <label for="radSlider">Connection Radius ($\Delta \theta$): <span id="radVal">1.2</span> rad</label>
      <input type="range" id="radSlider" min="0.4" max="2.5" step="0.1" value="1.2">
    </div>

    <div class="control-group">
      <label for="progSlider">Path Traversal Progress</label>
      <input type="range" id="progSlider" min="0" max="1" step="0.005" value="0">
    </div>

    <div class="control-group">
      <label class="checkbox-label">
        <input type="checkbox" id="chkGraph" checked> Show Nodes & PRM Network
      </label>
    </div>

    <div id="status">Nodes: 0 | Path: Not found</div>
  </div>

  <div id="viewport"></div>

  <script>
    // --- Setup Three.js Context ---
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a20);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(6, 6, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.update();

    // 3D Transform Gizmo Controller
    const transformControl = new THREE.TransformControls(camera, renderer.domElement);
    transformControl.setSize(0.75);
    scene.add(transformControl);

    transformControl.addEventListener('dragging-changed', function (event) {
      controls.enabled = !event.value;
    });

    // Lights & Grid
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(10, 20, 0x444455, 0x222233);
    scene.add(grid);

    // --- Robot Arm Parameters ---
    const L1 = 1.2, L2 = 1.0, L3 = 0.8;

    // --- Obstacle Spheres ---
    const obsBlue = {
      pos: new THREE.Vector3(0.6, 1.4, 0.5),
      radius: 0.55,
      mesh: null
    };
    const obsYellow = {
      pos: new THREE.Vector3(-0.5, 1.8, -0.4),
      radius: 0.65,
      mesh: null
    };

    function createSphereObstacle(obs, color) {
      const geo = new THREE.SphereGeometry(obs.radius, 32, 32);
      const mat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.8 });
      obs.mesh = new THREE.Mesh(geo, mat);
      obs.mesh.position.copy(obs.pos);
      scene.add(obs.mesh);
    }

    createSphereObstacle(obsBlue, 0x3b82f6);
    createSphereObstacle(obsYellow, 0xeab308);

    // Attach gizmo to blue sphere initially
    transformControl.attach(obsBlue.mesh);

    // --- Robot Visuals ---
    const armGroup = new THREE.Group();
    scene.add(armGroup);

    const matBase = new THREE.MeshPhongMaterial({ color: 0x64748b });
    const matLink1 = new THREE.MeshPhongMaterial({ color: 0xef4444 });
    const matLink2 = new THREE.MeshPhongMaterial({ color: 0x10b981 });
    const matLink3 = new THREE.MeshPhongMaterial({ color: 0x8b5cf6 });

    const meshBase = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.2, 16), matBase);
    meshBase.position.y = 0.1;
    armGroup.add(meshBase);

    const link1Mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, L1, 16), matLink1);
    const link2Mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, L2, 16), matLink2);
    const link3Mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, L3, 16), matLink3);
    armGroup.add(link1Mesh, link2Mesh, link3Mesh);

    // Forward Kinematics
    function getKinematics(theta) {
      const [t1, t2, t3] = theta;
      const p0 = new THREE.Vector3(0, 0.2, 0);

      const dir1 = new THREE.Vector3(Math.cos(t2) * Math.cos(t1), Math.sin(t2), Math.cos(t2) * Math.sin(t1));
      const p1 = p0.clone().addScaledVector(dir1, L1);

      const dir2 = new THREE.Vector3(Math.cos(t2 + t3) * Math.cos(t1), Math.sin(t2 + t3), Math.cos(t2 + t3) * Math.sin(t1));
      const p2 = p1.clone().addScaledVector(dir2, L2);
      const p3 = p2.clone().addScaledVector(dir2, L3);

      return [p0, p1, p2, p3];
    }

    function updateArmVisual(theta) {
      const [p0, p1, p2, p3] = getKinematics(theta);
      
      function setSegment(mesh, a, b) {
        const mid = a.clone().add(b).multiplyScalar(0.5);
        mesh.position.copy(mid);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
      }

      setSegment(link1Mesh, p0, p1);
      setSegment(link2Mesh, p1, p2);
      setSegment(link3Mesh, p2, p3);
    }

    // Line Segment to Sphere Collision Detection
    function distSegmentSphere(a, b, obs) {
      const ab = b.clone().sub(a);
      const ac = obs.pos.clone().sub(a);
      const t = Math.max(0, Math.min(1, ac.dot(ab) / ab.lengthSq()));
      const closest = a.clone().addScaledVector(ab, t);
      return closest.distanceTo(obs.pos) < obs.radius;
    }

    function isStateCollisionFree(theta) {
      const pts = getKinematics(theta);
      for (let i = 0; i < 3; i++) {
        if (distSegmentSphere(pts[i], pts[i+1], obsBlue)) return false;
        if (distSegmentSphere(pts[i], pts[i+1], obsYellow)) return false;
      }
      return true;
    }

    function isPathCollisionFree(tA, tB, steps = 8) {
      for (let i = 0; i <= steps; i++) {
        const alpha = i / steps;
        const interp = [
          tA[0] + alpha * (tB[0] - tA[0]),
          tA[1] + alpha * (tB[1] - tA[1]),
          tA[2] + alpha * (tB[2] - tA[2])
        ];
        if (!isStateCollisionFree(interp)) return false;
      }
      return true;
    }

    // --- Configuration Space Box Domain ---
    // Nodes sampled uniformly inside a 3D configuration-space box
    const CSPACE_BOX = {
      min: [-Math.PI, 0, -Math.PI / 2],
      max: [Math.PI, Math.PI, Math.PI / 2]
    };

    function sampleRandomConfigurationBox() {
      return [
        CSPACE_BOX.min[0] + Math.random() * (CSPACE_BOX.max[0] - CSPACE_BOX.min[0]),
        CSPACE_BOX.min[1] + Math.random() * (CSPACE_BOX.max[1] - CSPACE_BOX.min[1]),
        CSPACE_BOX.min[2] + Math.random() * (CSPACE_BOX.max[2] - CSPACE_BOX.min[2])
      ];
    }

    // --- PRM Roadmap State ---
    let startState = [0.2, 0.5, 0.3];
    let goalState = [Math.PI * 0.7, 0.4, -0.5];
    let vertices = [];
    let graph = [];
    let solvedPath = [];

    const nodeSpheresGroup = new THREE.Group();
    const graphLinesGroup = new THREE.Group();
    const pathLineGroup = new THREE.Group();
    scene.add(nodeSpheresGroup, graphLinesGroup, pathLineGroup);

    // Shared sphere geometry & materials
    const nodeSphereGeo = new THREE.SphereGeometry(0.065, 12, 12);
    const startGoalSphereGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const matFreeNode = new THREE.MeshPhongMaterial({ color: 0x22c55e, emissive: 0x115e2e });
    const matCollisionNode = new THREE.MeshPhongMaterial({ color: 0xef4444, emissive: 0x7f1d1d });
    const matStartNode = new THREE.MeshPhongMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8 });
    const matGoalNode = new THREE.MeshPhongMaterial({ color: 0xeab308, emissive: 0x854d0e });

    function distanceCSpace(a, b) {
      return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2);
    }

    function resetRoadmap() {
      vertices = [
        { theta: startState, free: isStateCollisionFree(startState), id: 0 },
        { theta: goalState, free: isStateCollisionFree(goalState), id: 1 }
      ];
      rebuildGraph();
    }

    function addVertices(count = 100) {
      for (let i = 0; i < count; i++) {
        const theta = sampleRandomConfigurationBox();
        vertices.push({
          theta: theta,
          free: isStateCollisionFree(theta),
          id: vertices.length
        });
      }
      rebuildGraph();
    }

    function rebuildGraph() {
      const radius = parseFloat(document.getElementById('radSlider').value);
      const showGraph = document.getElementById('chkGraph').checked;
      
      graph = Array.from({ length: vertices.length }, () => []);
      
      while(nodeSpheresGroup.children.length) nodeSpheresGroup.remove(nodeSpheresGroup.children[0]);
      while(graphLinesGroup.children.length) graphLinesGroup.remove(graphLinesGroup.children[0]);
      while(pathLineGroup.children.length) pathLineGroup.remove(pathLineGroup.children[0]);

      const lineMat = new THREE.LineBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.35 });
      const linePositions = [];

      // Render Nodes
      if (showGraph) {
        for (let i = 0; i < vertices.length; i++) {
          const v = vertices[i];
          const eePos = getKinematics(v.theta)[3];

          let mat = v.free ? matFreeNode : matCollisionNode;
          let geo = nodeSphereGeo;

          if (i === 0) { mat = matStartNode; geo = startGoalSphereGeo; }
          else if (i === 1) { mat = matGoalNode; geo = startGoalSphereGeo; }

          const sphereMesh = new THREE.Mesh(geo, mat);
          sphereMesh.position.copy(eePos);
          nodeSpheresGroup.add(sphereMesh);
        }
      }

      // Connect PRM Graph Edges
      for (let i = 0; i < vertices.length; i++) {
        if (!vertices[i].free) continue;
        for (let j = i + 1; j < vertices.length; j++) {
          if (!vertices[j].free) continue;

          const dist = distanceCSpace(vertices[i].theta, vertices[j].theta);
          if (dist <= radius) {
            if (isPathCollisionFree(vertices[i].theta, vertices[j].theta)) {
              graph[i].push({ node: j, weight: dist });
              graph[j].push({ node: i, weight: dist });

              if (showGraph) {
                const pA = getKinematics(vertices[i].theta)[3];
                const pB = getKinematics(vertices[j].theta)[3];
                linePositions.push(pA.x, pA.y, pA.z, pB.x, pB.y, pB.z);
              }
            }
          }
        }
      }

      if (showGraph && linePositions.length > 0) {
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        graphLinesGroup.add(new THREE.LineSegments(geom, lineMat));
      }

      solveAStar();
    }

    function solveAStar() {
      const start = 0, goal = 1;
      const dists = Array(vertices.length).fill(Infinity);
      const parent = Array(vertices.length).fill(null);
      const openSet = new Set([start]);

      dists[start] = 0;

      while (openSet.size > 0) {
        let current = null;
        let minF = Infinity;

        for (const node of openSet) {
          const fScore = dists[node] + distanceCSpace(vertices[node].theta, vertices[goal].theta);
          if (fScore < minF) {
            minF = fScore;
            current = node;
          }
        }

        if (current === goal) break;

        openSet.delete(current);

        for (const edge of graph[current]) {
          const alt = dists[current] + edge.weight;
          if (alt < dists[edge.node]) {
            dists[edge.node] = alt;
            parent[edge.node] = current;
            openSet.add(edge.node);
          }
        }
      }

      solvedPath = [];
      let curr = goal;
      if (parent[curr] !== null || curr === start) {
        while (curr !== null) {
          solvedPath.unshift(vertices[curr].theta);
          curr = parent[curr];
        }
      }

      const statusEl = document.getElementById('status');
      if (solvedPath.length > 1) {
        statusEl.className = 'status success';
        statusEl.innerText = `Nodes: ${vertices.length} | Path Found (${solvedPath.length} steps)`;
        renderSolutionPath();
      } else {
        statusEl.className = 'status fail';
        statusEl.innerText = `Nodes: ${vertices.length} | No path found`;
      }
    }

    function renderSolutionPath() {
      const points = [];
      for (const theta of solvedPath) {
        points.push(getKinematics(theta)[3]);
      }
      const geom = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color: 0x10b981, linewidth: 3 });
      pathLineGroup.add(new THREE.Line(geom, mat));
    }

    // Synchronize Transform Gizmo with Sliders and Collision Logic
    transformControl.addEventListener('change', () => {
      const activeObj = transformControl.object;
      if (!activeObj) return;

      if (activeObj === obsBlue.mesh) {
        obsBlue.pos.copy(obsBlue.mesh.position);
        updateUIValues('bX', 'bY', 'bZ', obsBlue.pos);
      } else if (activeObj === obsYellow.mesh) {
        obsYellow.pos.copy(obsYellow.mesh.position);
        updateUIValues('yX', 'yY', 'yZ', obsYellow.pos);
      }

      for (let v of vertices) {
        v.free = isStateCollisionFree(v.theta);
      }
      rebuildGraph();
    });

    function updateUIValues(prefixX, prefixY, prefixZ, pos) {
      document.getElementById(prefixX + 'Slider').value = pos.x;
      document.getElementById(prefixX + 'Val').innerText = pos.x.toFixed(2);
      document.getElementById(prefixY + 'Slider').value = pos.y;
      document.getElementById(prefixY + 'Val').innerText = pos.y.toFixed(2);
      document.getElementById(prefixZ + 'Slider').value = pos.z;
      document.getElementById(prefixZ + 'Val').innerText = pos.z.toFixed(2);
    }

    // --- Dynamic Obstacle Position Sliders ---
    function setupObstacleSlider(sliderId, valId, obsObj, coord) {
      document.getElementById(sliderId).addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        document.getElementById(valId).innerText = val.toFixed(2);
        obsObj.pos[coord] = val;
        obsObj.mesh.position.copy(obsObj.pos);

        for (let v of vertices) {
          v.free = isStateCollisionFree(v.theta);
        }
        rebuildGraph();
      });
    }

    setupObstacleSlider('bXSlider', 'bXVal', obsBlue, 'x');
    setupObstacleSlider('bYSlider', 'bYVal', obsBlue, 'y');
    setupObstacleSlider('bZSlider', 'bZVal', obsBlue, 'z');

    setupObstacleSlider('yXSlider', 'yXVal', obsYellow, 'x');
    setupObstacleSlider('yYSlider', 'yYVal', obsYellow, 'y');
    setupObstacleSlider('yZSlider', 'yZVal', obsYellow, 'z');

    // Gizmo Switch Buttons
    const btnGizmoBlue = document.getElementById('btnGizmoBlue');
    const btnGizmoYellow = document.getElementById('btnGizmoYellow');

    btnGizmoBlue.addEventListener('click', () => {
      transformControl.attach(obsBlue.mesh);
      btnGizmoBlue.className = 'active';
      btnGizmoYellow.className = 'secondary';
    });

    btnGizmoYellow.addEventListener('click', () => {
      transformControl.attach(obsYellow.mesh);
      btnGizmoYellow.className = 'active';
      btnGizmoBlue.className = 'secondary';
    });

    // Roadmap Control Buttons
    document.getElementById('btnAdd').addEventListener('click', () => addVertices(100));
    document.getElementById('btnRestart').addEventListener('click', resetRoadmap);
    
    document.getElementById('btnGoal').addEventListener('click', () => {
      goalState = sampleRandomConfigurationBox();
      if (vertices.length >= 2) {
        vertices[1] = {
          theta: goalState,
          free: isStateCollisionFree(goalState),
          id: 1
        };
      } else {
        resetRoadmap();
        return;
      }
      rebuildGraph();
    });

    document.getElementById('radSlider').addEventListener('input', (e) => {
      document.getElementById('radVal').innerText = e.target.value;
      rebuildGraph();
    });

    document.getElementById('chkGraph').addEventListener('change', rebuildGraph);

    // Path Progress Slider
    document.getElementById('progSlider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (solvedPath.length < 2) return;

      const totalSegments = solvedPath.length - 1;
      const scaledVal = val * totalSegments;
      const idx = Math.min(Math.floor(scaledVal), totalSegments - 1);
      const alpha = scaledVal - idx;

      const tA = solvedPath[idx];
      const tB = solvedPath[idx + 1];

      const currentTheta = [
        tA[0] + alpha * (tB[0] - tA[0]),
        tA[1] + alpha * (tB[1] - tA[1]),
        tA[2] + alpha * (tB[2] - tA[2])
      ];

      updateArmVisual(currentTheta);
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // --- Start Application ---
    resetRoadmap();
    addVertices(100);
    updateArmVisual(startState);

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
